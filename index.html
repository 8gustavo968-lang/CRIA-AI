<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0F1320"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="manifest.json"/>
<title>Cria</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#0F1320;overflow:hidden}
#boot{display:flex;align-items:center;justify-content:center;height:100vh;color:#F2B705;font-family:system-ui;font-size:18px}
iframe{border:0;width:100%;height:100%;position:fixed;inset:0}
</style>
</head>
<body>
<div id="boot">✦ Carregando Cria…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(async function(){
  var boot=document.getElementById('boot');
  try{
    if('serviceWorker' in navigator){
      var regs=await navigator.serviceWorker.getRegistrations();
      for(var i=0;i<regs.length;i++) await regs[i].unregister();
      if(window.caches){
        var ks=await caches.keys();
        await Promise.all(ks.map(function(k){return caches.delete(k);}));
      }
    }
    var res=await fetch('./cria-github.zip?v=14');
    if(!res.ok) throw new Error('zip '+res.status);
    var zip=await JSZip.loadAsync(await res.arrayBuffer());
    var file=zip.file('cria-github/index.html');
    if(!file) throw new Error('index nao encontrado');
    var html=await file.async('string');
    var iframe=document.createElement('iframe');
    iframe.setAttribute('allow','microphone; camera; autoplay; clipboard-write');
    iframe.title='Cria';
    iframe.srcdoc=html;
    iframe.onload=function(){ if(boot) boot.remove(); };
    document.body.appendChild(iframe);
  }catch(err){
    console.error(err);
    if(boot) boot.textContent='Erro: '+(err&&err.message?err.message:String(err));
  }
})();
</script>
</body>
</html>
