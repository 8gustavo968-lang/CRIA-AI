<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0F1320"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>Cria</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#0F1320;overflow:hidden}
iframe{border:0;width:100%;height:100%;position:fixed;inset:0}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#F2B705;font-family:system-ui;z-index:2;background:#0F1320;gap:10px;padding:20px;text-align:center}
#boot .err{color:#ff6b6b;font-size:13px;max-width:320px}
</style>
</head>
<body>
<div id="boot">
  <div>✦ Carregando Cria…</div>
  <div id="st" style="color:#9AA3B8;font-size:13px">baixando app</div>
</div>
<script>
(function(){
  var boot=document.getElementById('boot');
  var st=document.getElementById('st');
  function setSt(t){ if(st) st.textContent=t; }
  function fail(m){
    if(boot) boot.innerHTML='<div>✦ Erro</div><div class="err">'+m+'</div><div style="color:#9AA3B8;font-size:12px">Tenta aba anônima</div>';
  }
  (async function(){
    try{
      setSt('parte 1/3…');
      var p0=await fetch('./app_part_0.txt?v=101').then(function(r){ if(!r.ok) throw new Error('part0 '+r.status); return r.text(); });
      setSt('parte 2/3…');
      var p1=await fetch('./app_part_1.txt?v=101').then(function(r){ if(!r.ok) throw new Error('part1 '+r.status); return r.text(); });
      setSt('parte 3/3…');
      var p2=await fetch('./app_part_2.txt?v=101').then(function(r){ if(!r.ok) throw new Error('part2 '+r.status); return r.text(); });
      setSt('abrindo…');
      var html=p0+p1+p2;
      if(html.indexOf('CriaFloatingBar')<0 && html.indexOf('Cria')<0) throw new Error('app incompleto');
      var iframe=document.createElement('iframe');
      iframe.setAttribute('allow','microphone; camera; autoplay; clipboard-write');
      iframe.title='Cria';
      iframe.srcdoc=html;
      iframe.onload=function(){ if(boot) boot.remove(); };
      document.body.appendChild(iframe);
      setTimeout(function(){ if(boot&&boot.parentNode) boot.remove(); }, 12000);
    }catch(e){ console.error(e); fail(e.message||String(e)); }
  })();
})();
</script>
</body>
</html>
