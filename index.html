<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0F1320" />
  <title>Cria</title>
  <style>
    body { margin:0; background:#0F1320; color:#F2B705; font-family:system-ui,sans-serif; }
    #boot { display:flex; align-items:center; justify-content:center; height:100vh; font-size:18px; }
  </style>
</head>
<body>
  <div id="boot">✦ Carregando Cria…</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const r of regs) await r.unregister();
          if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
          }
        }
        const res = await fetch('./cria-github.zip?v=6');
        if (!res.ok) throw new Error('zip ' + res.status);
        const zip = await JSZip.loadAsync(await res.arrayBuffer());
        const file = zip.file('cria-github/index.html');
        if (!file) throw new Error('index.html nao encontrado');
        const html = await file.async('string');
        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        const boot = document.getElementById('boot');
        if (boot) boot.textContent = 'Erro: ' + (err && err.message ? err.message : err);
        console.error(err);
      }
    })();
  </script>
</body>
</html>
