<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0F1320" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cria" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.svg" />
  <title>Cria</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0F1320; overflow: hidden; }
    #boot { display:flex; align-items:center; justify-content:center; height:100vh; color:#F2B705; font-size:18px; font-family: system-ui, sans-serif; }
    iframe { border: 0; width: 100%; height: 100%; position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="boot">✦ Carregando Cria…</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    (async function () {
      const boot = document.getElementById('boot');
      try {
        const res = await fetch('./cria-github.zip?v=5');
        if (!res.ok) throw new Error('zip ' + res.status);
        const zip = await JSZip.loadAsync(await res.arrayBuffer());
        const file = zip.file('cria-github/index.html');
        if (!file) throw new Error('index.html nao encontrado');
        let html = await file.async('string');
        // Fix relative paths for service worker / manifest inside blob iframe
        html = html.replace('href="manifest.json"', 'href="' + location.origin + location.pathname.replace(/\/[^/]*$/, '/') + 'manifest.json"');
        html = html.replace('./sw.js', location.origin + location.pathname.replace(/\/[^/]*$/, '/') + 'sw.js');
        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.title = 'Cria';
        iframe.onload = function () { if (boot) boot.remove(); };
        document.body.appendChild(iframe);
      } catch (err) {
        if (boot) boot.textContent = 'Erro: ' + (err && err.message ? err.message : err);
        console.error(err);
      }
    })();
  </script>
</body>
</html>
