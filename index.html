<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0F1320"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>Cria</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#0F1320;overflow:hidden}
iframe{border:0;width:100%;height:100%;position:fixed;inset:0}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#F2B705;font-family:system-ui;z-index:2;background:#0F1320;gap:10px;padding:20px;text-align:center}
#boot .err{color:#ff6b6b;font-size:13px;max-width:320px;word-break:break-word}
</style>
</head>
<body>
<div id="boot">
  <div>✦ Carregando Cria…</div>
  <div id="st" style="color:#9AA3B8;font-size:13px">preparando</div>
</div>
<script>
(function(){
  var boot=document.getElementById('boot');
  var st=document.getElementById('st');
  function setSt(t){ if(st) st.textContent=t; }
  function fail(m){ if(boot) boot.innerHTML='<div>✦ Erro</div><div class="err">'+m+'</div><div style="color:#9AA3B8;font-size:12px">Abre em aba anonima / Chrome</div>'; }
  function b64ToBytes(b64){
    var bin=atob(b64);
    var arr=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return arr;
  }
  async function gunzipBytes(bytes){
    if (typeof DecompressionStream !== 'undefined') {
      var stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return await new Response(stream).text();
    }
    throw new Error('Navegador sem DecompressionStream. Usa Chrome/Edge/Firefox recente.');
  }
  (async function(){
    try{
      setSt('baixando app (1/2)…');
      var a=await fetch('./app_b64_a.txt?v=110').then(function(r){ if(!r.ok) throw new Error('b64a '+r.status); return r.text(); });
      setSt('baixando app (2/2)…');
      var b=await fetch('./app_b64_b.txt?v=110').then(function(r){ if(!r.ok) throw new Error('b64b '+r.status); return r.text(); });
      setSt('descompactando…');
      var bytes=b64ToBytes((a+b).replace(/\s+/g,''));
      var html=await gunzipBytes(bytes);
      if(html.indexOf('Cria')<0) throw new Error('app invalido');
      setSt('abrindo…');
      var iframe=document.createElement('iframe');
      iframe.setAttribute('allow','microphone; camera; autoplay; clipboard-write');
      iframe.title='Cria';
      iframe.srcdoc=html;
      iframe.onload=function(){ if(boot) boot.remove(); };
      document.body.appendChild(iframe);
      setTimeout(function(){ if(boot&&boot.parentNode) boot.remove(); }, 15000);
    }catch(e){ console.error(e); fail(e.message||String(e)); }
  })();
})();
</script>
<script src="./overlay.js?v=110"></script>
</body>
</html>
