<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0F1320" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cria" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.svg" />
  <title>Cria</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; background: #0F1320; color: #EDEFF5; font-family: system-ui, sans-serif; }
    #boot { display:flex; align-items:center; justify-content:center; height:100vh; color:#F2B705; font-size:18px; }
  </style>
</head>
<body>
  <div id="boot">✦ Carregando Cria…</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    (async function () {
      try {
        const res = await fetch('./cria-github.zip');
        if (!res.ok) throw new Error('zip ' + res.status);
        const buf = await res.arrayBuffer();
        const zip = await JSZip.loadAsync(buf);
        const file = zip.file('cria-github/index.html');
        if (!file) throw new Error('index.html nao encontrado no zip');
        const html = await file.async('string');
        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        document.getElementById('boot').textContent = 'Erro ao carregar. Recarregue a pagina.';
        console.error(err);
      }
    })();
  </script>
</body>
</html>
