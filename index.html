<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0F1320"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>Cria</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#0F1320;overflow:hidden}
iframe{border:0;width:100%;height:100%;position:fixed;inset:0}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#F2B705;font-family:system-ui;z-index:1;background:#0F1320}
</style>
</head>
<body>
<div id="boot">✦ Carregando Cria…</div>
<iframe id="app" src="./app.html?v=100" allow="microphone; camera; autoplay; clipboard-write" title="Cria"></iframe>
<script>
document.getElementById('app').onload=function(){
  var b=document.getElementById('boot');
  if(b) b.remove();
};
setTimeout(function(){var b=document.getElementById('boot'); if(b) b.remove();},8000);
</script>
</body>
</html>
